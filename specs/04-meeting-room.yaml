feature: meeting-room-reservation
slice: 4
title: "Salle de Réunion"
user_stories: [US-3.3]
estimated_days: 3
status: ready

dependencies: [slice-01, slice-02]

# ─── BASE DE DONNÉES ──────────────────────────────────────────────────────────
database:
  provider: Neon (Serverless Postgres)
  local_branch: develop

# ─── MOCKS ACTIFS ─────────────────────────────────────────────────────────────
mocks:
  stripe:
    variable: "STRIPE_MOCK=true + NEXT_PUBLIC_STRIPE_MOCK=true"
    behavior: |
      Flux Payment Intent entièrement local — aucun compte Stripe requis :
      1. POST /api/booking/meeting-room → mockStripe.paymentIntents.create()
      2. Retourne { reservationId, clientSecret: "pi_mock_..._secret_mock" }
      3. UI affiche bouton "Simuler le paiement" (si NEXT_PUBLIC_STRIPE_MOCK=true)
      4. Ce bouton appelle POST /api/stripe-mock/confirm-payment
      5. Webhook mock déclenché → Reservation.status = CONFIRMED
    files:
      - lib/stripe-mock.ts
      - lib/stripe.ts
      - app/api/stripe-mock/confirm-payment/route.ts
      - __tests__/__mocks__/stripe.ts
    when_stripe_ready:
      - "Compte Stripe configuré (voir Slice 2)"
      - "Installer @stripe/react-stripe-js et @stripe/stripe-js"
      - "Remplacer le bouton 'Simuler' par <PaymentElement>"
      - "Gérer stripe.confirmPayment() côté client"
      - "Passer STRIPE_MOCK=false + NEXT_PUBLIC_STRIPE_MOCK=false"
      - "Tester avec carte 4242 4242 4242 4242"
  brevo:
    variable: "BREVO_MOCK=true"
    behavior: "Logge les emails en console + stocke dans mockEmailLog[] — aucun envoi réel"
    emails_triggered:
      - template: "confirmation-salle-reunion"
        trigger: "Webhook payment_intent.succeeded → Reservation CONFIRMED"
        variables: [user.name, date, start, end, durationHours, amountPaidEuros]

# ─── ENV REQUIS ───────────────────────────────────────────────────────────────
env_required:
  DATABASE_URL: "connection string Neon branche develop"
  NEXTAUTH_SECRET: "valeur des Slices précédentes"
  NEXTAUTH_URL: "http://localhost:3000"
  STRIPE_MOCK: "true"
  NEXT_PUBLIC_STRIPE_MOCK: "true"
  BREVO_MOCK: "true"

# ─── RÈGLES MÉTIER ────────────────────────────────────────────────────────────
out_of_scope:
  - "Règle gratuité coworker < 2h — gestion physique, NE PAS IMPLÉMENTER"

pricing:
  hourly_cents: 2500
  half_day_cents: 10000
  full_day_cents: 20000
  minimum_hours: 2
  minimum_amount_cents: 5000

reservation_lifecycle:
  - "Création → status=PENDING + stripePaymentIntentId stocké"
  - "Webhook succeeded → status=CONFIRMED"
  - "Timeout 30min sans paiement → status=CANCELLED (cron job)"

# ─── TESTS ────────────────────────────────────────────────────────────────────
tests:

  unit:
    file: "__tests__/meeting-room.test.ts"
    cases:
      - "2h = 5000 cents"
      - "3h = 7500 cents"
      - "Demi-journée = 10000 cents"
      - "Journée = 20000 cents"
      - "Durée < 2h → erreur validation"
      - "Création avec status=PENDING avant paiement"
      - "Webhook succeeded → status=CONFIRMED"

  http:
    file: "__tests__/api/slice-04-meeting-room.http.test.ts"
    tool: next-test-api-route-handler
    mocks_required:
      - "vi.mock('@/lib/stripe')  ← retourne pi_mock_ sans appel Stripe réel"
      - "vi.mock('@/lib/brevo')   ← capture emails sans envoi"
    cases:
      - route: "POST /api/booking/meeting-room"
        scenario: "Réservation valide 2h"
        auth: externe@test.fr
        body: { start: "FUTURE_DATE 09:00", end: "FUTURE_DATE 11:00" }
        expected_status: 200
        expected_body: { reservationId: "string", clientSecret: "string" }
        side_effects: ["Reservation créée avec status=PENDING"]
        assert_brevo: "brevo.sendEmail NON appelé (envoi après webhook seulement)"

      - route: "POST /api/booking/meeting-room"
        scenario: "Durée < 2h → 422"
        body: { start: "09:00", end: "10:00" }
        expected_status: 422

      - route: "POST /api/booking/meeting-room"
        scenario: "Conflit créneau → 409"
        expected_status: 409

      - route: "POST /api/webhooks/stripe"
        scenario: "payment_intent.succeeded → CONFIRMED"
        body: "stripeTestHelpers.mockPaymentIntentSucceeded({ reservationId })"
        headers: { stripe-signature: "mock_signature" }
        expected_status: 200
        side_effects: ["Reservation.status = CONFIRMED"]
        assert_brevo: "brevo.sendEmail appelé avec template='confirmation-salle-reunion'"

  e2e:
    file: "e2e/slice-04-meeting-room.spec.ts"
    tool: playwright
    stripe_mode: "MOCK — bouton 'Simuler le paiement' au lieu de Stripe Elements"
    cases:
      - "Sélection 2h → prix affiché = 50€"
      - "Sélection < 2h → bouton confirmer désactivé"
      - "Clic 'Simuler le paiement' → CONFIRMED → confirmation affichée"
      - "Console affiche '[Brevo Mock] confirmation-salle-reunion'"
      - "Conflit créneau → message d'erreur clair"

done_when:
  - npm run test → vert
  - npm run test:e2e:slice4 → vert
  - Réservation salle fonctionnelle via bouton 'Simuler' sans compte Stripe
  - Console affiche le mock Brevo après confirmation
