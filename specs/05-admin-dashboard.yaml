feature: admin-openspace
slice: 5
title: "Administration — Open-Space & Membres"
user_stories: [US-4.1, US-4.2, US-4.3, US-4.4, US-4.5, US-4.6, US-4.7]
estimated_days: 4
status: ready

dependencies: [slice-01, slice-02, slice-03]

# ─── PÉRIMÈTRE ────────────────────────────────────────────────────────────────
scope:
  included: |
    Gestion des membres (tableau, solde, statut adhérent, alerte)
    Réservations proxy open-space (au nom d'un membre)
    Blocage organisation (événement, fermeture partielle)
    Fermeture de date complète (batch annulation + remboursement + emails)
    Ajustement manuel de crédits
    Export CSV des réservations open-space
    Paramétrage de la capacité open-space (DESK_CAPACITY)

  out_of_scope: |
    TOUT ce qui concerne la salle de réunion — specs fonctionnelles en cours
    de discussion avec le business. Sera traité dans une Slice dédiée ultérieure.
    Cela inclut :
      - Gestion admin des réservations salle de réunion
      - Remboursements Stripe pour annulation salle
      - Tarification salle de réunion
      - Export CSV spécifique salle de réunion
      - Proxy salle de réunion

# ─── BASE DE DONNÉES ──────────────────────────────────────────────────────────
database:
  provider: Neon (Serverless Postgres)
  local_branch: develop
  migration_required: false
  note: |
    Pas de nouveau modèle Prisma — tous les modèles nécessaires (User, Reservation,
    Transaction, ClosedDate, SystemSetting) sont déjà en place depuis les Slices
    précédentes. Cette Slice exploite uniquement les types DESK et ORGANIZATION.

# ─── MOCKS ACTIFS ─────────────────────────────────────────────────────────────
mocks:
  stripe: "non requis pour cette Slice"
  brevo:
    variable: "BREVO_MOCK=true"
    behavior: "Logge les emails en console + stocke dans mockEmailLog[] — aucun envoi réel"
    emails_triggered:
      - template: "confirmation-reservation"
        trigger: "Réservation proxy DESK créée"
        to: "utilisateur CIBLE (pas l'admin)"
        variables: [user.name, date, slot, costCredits, isProxy=true]
      - template: "annulation-par-admin"
        trigger: "Fermeture de date — N emails, un par utilisateur DESK impacté"
        variables: [user.name, date, closureReason, creditsRefunded]
        note: "Le test vérifie que brevo.sendEmail est appelé EXACTEMENT N fois (pas N+1)"

# ─── ENV REQUIS ───────────────────────────────────────────────────────────────
env_required:
  DATABASE_URL: "connection string Neon branche develop"
  NEXTAUTH_SECRET: "valeur des Slices précédentes"
  NEXTAUTH_URL: "http://localhost:3000"
  STRIPE_MOCK: "true"
  BREVO_MOCK: "true"

# ─── ROUTES API ───────────────────────────────────────────────────────────────
api_routes:
  - "GET  /api/admin/members                    → liste membres + stats résas"
  - "PUT  /api/admin/members/[id]/credits       → ajustement manuel crédits"
  - "PUT  /api/admin/members/[id]/member-status → toggle isMember"
  - "POST /api/admin/bookings/proxy             → réservation DESK au nom d'un membre"
  - "POST /api/admin/bookings/organisation      → blocage ORGANIZATION (événement)"
  - "POST /api/admin/close-date                 → fermeture date (batch atomique)"
  - "PUT  /api/admin/settings/capacity          → modifier DESK_CAPACITY"
  - "GET  /api/admin/export/reservations        → CSV réservations DESK uniquement"

# ─── RÈGLES MÉTIER ────────────────────────────────────────────────────────────
business_rules:

  member_alert:
    rule: "!isMember AND count(CONFIRMED DESK reservations) > 3 → ligne rouge dans le tableau"
    note: "Compte uniquement les réservations DESK, pas les futures MEETING_ROOM"

  proxy:
    - "type=DESK uniquement — pas de proxy salle de réunion dans cette Slice"
    - "isProxy=true sur la réservation"
    - "Débite les crédits de l'utilisateur CIBLE, pas de l'admin"
    - "Respecte le seuil -3 pour l'utilisateur cible"
    - "Email envoyé à l'utilisateur CIBLE, pas à l'admin"

  organisation:
    - "type=ORGANIZATION, userId=null, costCredits=null"
    - "Impacte la capacité DESK du jour (réduit remaining de 1)"
    - "Aucun email envoyé — blocage silencieux"
    - "Utilisé pour événements ou réservations non-membres ponctuelles"

  credit_adjustment:
    - "delta peut être positif ou négatif"
    - "description obligatoire (Zod — 422 si absente)"
    - "Crée Transaction(ADMIN_ADJUSTMENT, description)"
    - "Aucun email envoyé — ajustement silencieux"

  date_closure_batch: |
    $transaction atomique (tout réussit ou tout rollback) :
    1. Vérifier qu'aucune ClosedDate n'existe déjà pour cette date → sinon 409
    2. Créer ClosedDate avec reason
    3. Récupérer toutes les Reservation CONFIRMED DESK sur cette date
    4. Pour chacune : status=CANCELLED + User.credits += costCredits
       + Transaction(CANCELLATION_REFUND)
    5. brevo.sendEmail('annulation-par-admin') à chaque user impacté
    6. Créer Reservation(type=ORGANIZATION) pour bloquer visuellement la journée
    IMPORTANT : ne traiter QUE les CONFIRMED — ignorer les déjà CANCELLED

  capacity_setting:
    - "DESK_CAPACITY stockée dans SystemSetting"
    - "Modification immédiate — impacte les futures vérifications de disponibilité"
    - "Valeur minimum : 1"

  csv_export:
    - "Exporte uniquement les réservations DESK (pas ORGANIZATION, pas MEETING_ROOM)"
    - "Colonnes : date, slot, user.name, user.email, user.segment, costCredits, status, isProxy"
    - "Trié par date DESC"
    - "Filtres optionnels en query params : ?from=YYYY-MM-DD&to=YYYY-MM-DD&status=CONFIRMED"

# ─── FRONTEND ADMIN ───────────────────────────────────────────────────────────
frontend:
  route: "/admin"
  access: "role=ADMIN uniquement — middleware redirige les USER vers /dashboard"
  layout: "Sidebar ou onglets pour naviguer entre les sections"

  sections:
    membres:
      data_testids:
        - "admin-members-table"         # tableau principal
        - "member-row"                  # chaque ligne (une par user)
        - "member-alert-row"            # ligne rouge (!isMember + >3 résas)
        - "member-credits-value"        # solde affiché
        - "member-adjust-btn"           # ouvre modale ajustement
        - "adjust-delta-input"          # champ delta
        - "adjust-description-input"    # champ description (obligatoire)
        - "adjust-confirm-btn"          # soumettre ajustement
        - "member-status-toggle"        # toggle isMember

    proxy:
      data_testids:
        - "proxy-form"                  # formulaire réservation proxy
        - "proxy-target-select"         # sélecteur membre cible
        - "proxy-date-input"            # date
        - "proxy-slot-select"           # AM / PM / FULL
        - "proxy-submit-btn"            # soumettre
        - "proxy-success"               # message succès
        - "proxy-error-balance"         # erreur solde insuffisant cible

    fermeture:
      data_testids:
        - "close-date-form"             # formulaire fermeture
        - "close-date-input"            # date à fermer
        - "close-date-reason-input"     # motif (obligatoire)
        - "close-date-submit-btn"       # soumettre
        - "close-date-success"          # message succès + N emails envoyés
        - "close-date-already-closed"   # erreur date déjà fermée

    parametres:
      data_testids:
        - "capacity-input"              # champ DESK_CAPACITY
        - "capacity-save-btn"           # sauvegarder
        - "capacity-success"            # confirmation sauvegarde

    export:
      data_testids:
        - "export-csv-btn"              # déclenche le téléchargement

# ─── TESTS ────────────────────────────────────────────────────────────────────
tests:

  unit:
    file: "__tests__/admin.test.ts"
    cases:
      # Alertes membres
      - "Alerte rouge si !isMember ET reservationCount > 3"
      - "Pas d'alerte si isMember=true même avec > 3 résas DESK"
      - "Pas d'alerte si reservationCount = 3 (seuil strictement > 3)"
      # Proxy
      - "Proxy débite utilisateur CIBLE, pas admin"
      - "Proxy respecte seuil -3 pour l'utilisateur cible"
      - "Proxy crée isProxy=true"
      - "Proxy type=DESK uniquement"
      # Organisation
      - "Organisation type=ORGANIZATION, costCredits=null"
      - "Organisation réduit remaining de 1 sans débiter de crédits"
      # Batch fermeture
      - "Batch annule UNIQUEMENT les CONFIRMED DESK (ignore les CANCELLED)"
      - "Batch ne crée pas de double remboursement"
      - "Batch rembourse le bon costCredits à chaque user"
      - "Batch crée une Transaction CANCELLATION_REFUND par user impacté"
      - "Batch rollback complet si une étape échoue ($transaction)"
      # Ajustement crédits
      - "Ajustement crédit crée Transaction ADMIN_ADJUSTMENT avec description"
      - "Ajustement sans description → erreur validation"
      # CSV
      - "Export filtre uniquement les réservations DESK (pas ORGANIZATION)"

  http:
    file: "__tests__/api/slice-05-admin.http.test.ts"
    tool: next-test-api-route-handler
    mocks_required:
      - "vi.mock('@/lib/brevo')  ← CRITIQUE pour vérifier le nombre exact d'emails"

    cases:
      - route: "GET /api/admin/members"
        scenario: "Admin voit la liste des membres"
        auth: admin@placev.fr
        expected_status: 200
        expected_body: "Array<{ id, name, email, credits, isMember, reservationCount }>"

      - route: "GET /api/admin/members"
        scenario: "Non-admin → 403"
        auth: externe@test.fr
        expected_status: 403

      - route: "PUT /api/admin/members/[id]/credits"
        scenario: "Ajustement valide avec description"
        auth: admin@placev.fr
        body: { delta: 5, description: "Correction manuelle suite erreur" }
        expected_status: 200
        side_effects: ["user.credits += 5", "Transaction ADMIN_ADJUSTMENT créée"]
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "PUT /api/admin/members/[id]/credits"
        scenario: "Description manquante → 422"
        auth: admin@placev.fr
        body: { delta: 5 }
        expected_status: 422
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "PUT /api/admin/members/[id]/member-status"
        scenario: "Toggle isMember true → false"
        auth: admin@placev.fr
        body: { isMember: false }
        expected_status: 200

      - route: "POST /api/admin/bookings/proxy"
        scenario: "Proxy DESK valide"
        auth: admin@placev.fr
        body: { targetUserId: "id-externe", date: FUTURE_DATE, slot: "AM" }
        expected_status: 201
        side_effects:
          - "targetUser.credits -= 1 (pas admin.credits)"
          - "Reservation créée avec isProxy=true, type=DESK"
        assert_brevo: "brevo.sendEmail appelé avec template='confirmation-reservation' TO targetUser.email"

      - route: "POST /api/admin/bookings/proxy"
        scenario: "Solde cible insuffisant (credits < seuil)"
        auth: admin@placev.fr
        expected_status: 403
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/admin/bookings/organisation"
        scenario: "Blocage organisation valide"
        auth: admin@placev.fr
        body: { date: FUTURE_DATE, slot: "FULL", label: "Événement entreprise" }
        expected_status: 201
        side_effects: ["Reservation type=ORGANIZATION créée, userId=null"]
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/admin/close-date"
        scenario: "Fermeture avec 2 CONFIRMED + 1 déjà CANCELLED sur la date"
        auth: admin@placev.fr
        body: { date: FUTURE_DATE, reason: "Travaux" }
        setup: "Créer 2 résas CONFIRMED DESK + 1 CANCELLED DESK sur FUTURE_DATE"
        expected_status: 200
        side_effects:
          - "ClosedDate créée"
          - "2 résas CONFIRMED → CANCELLED (pas la 3e)"
          - "2 remboursements crédits (pas 3)"
        assert_brevo: "brevo.sendEmail appelé EXACTEMENT 2 fois"
        assert_brevo_template: "annulation-par-admin pour chaque user impacté"

      - route: "POST /api/admin/close-date"
        scenario: "Date déjà fermée → 409"
        auth: admin@placev.fr
        expected_status: 409
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "PUT /api/admin/settings/capacity"
        scenario: "Modification capacité valide"
        auth: admin@placev.fr
        body: { value: 12 }
        expected_status: 200
        side_effects: ["SystemSetting DESK_CAPACITY = '12'"]

      - route: "PUT /api/admin/settings/capacity"
        scenario: "Valeur < 1 → 422"
        auth: admin@placev.fr
        body: { value: 0 }
        expected_status: 422

      - route: "GET /api/admin/export/reservations"
        scenario: "Export CSV des réservations DESK"
        auth: admin@placev.fr
        expected_status: 200
        expected_headers: { Content-Type: "text/csv" }
        note: "Vérifier que ORGANIZATION et MEETING_ROOM sont absents du CSV"

  e2e:
    file: "e2e/slice-05-admin.spec.ts"
    tool: playwright
    cases:
      # Tableau membres
      - "Admin voit le tableau des membres avec solde et statut"
      - "Membre !isMember avec > 3 résas → ligne en rouge (member-alert-row)"
      - "Admin ajuste le solde d'un membre → description obligatoire → solde mis à jour"
      - "Admin toggle statut adhérent → mise à jour immédiate dans le tableau"
      # Proxy
      - "Admin crée réservation proxy pour un membre → proxy-success visible"
      - "Console affiche '[Brevo Mock] confirmation-reservation TO membre@email.fr'"
      - "Solde du membre CIBLE diminue (pas celui de l'admin)"
      - "Proxy refusé si solde cible insuffisant → proxy-error-balance visible"
      # Fermeture de date
      - "Admin ferme une date → close-date-success visible"
      - "Console affiche N fois '[Brevo Mock] annulation-par-admin'"
      - "Calendrier public marque la date comme fermée après la fermeture"
      - "Tentative de fermer une date déjà fermée → close-date-already-closed"
      # Paramètres
      - "Admin modifie DESK_CAPACITY → capacity-success visible"
      - "La nouvelle capacité est prise en compte dans GET /api/availability"
      # Export
      - "Clic export-csv-btn → téléchargement déclenché"

done_when:
  - npm run test → vert (unitaires + HTTP — 17 cas)
  - npm run test:e2e:slice5 → vert (15 scénarios Playwright)
  - Fermeture de date atomique sur Neon develop (rollback si erreur intermédiaire)
  - Console montre exactement N emails lors d'une fermeture (pas N+1)
  - Aucune route ou UI liée à la salle de réunion dans cette Slice