feature: admin-dashboard
slice: 5
title: "Administration Avancée"
user_stories: [US-4.1, US-4.2, US-4.3, US-4.4, US-4.5, US-4.6, US-4.7]
estimated_days: 4
status: ready

dependencies: [slice-01, slice-02, slice-03]

# ─── BASE DE DONNÉES ──────────────────────────────────────────────────────────
database:
  provider: Neon (Serverless Postgres)
  local_branch: develop

# ─── MOCKS ACTIFS ─────────────────────────────────────────────────────────────
mocks:
  stripe: "non requis pour cette Slice"
  brevo:
    variable: "BREVO_MOCK=true"
    behavior: "Logge les emails en console + stocke dans mockEmailLog[] — aucun envoi réel"
    emails_triggered:
      - template: "confirmation-reservation"
        trigger: "Réservation proxy créée"
        to: "utilisateur CIBLE (pas l'admin)"
        variables: [user.name, date, slot, costCredits, isProxy=true]
      - template: "annulation-par-admin"
        trigger: "Fermeture de date — N emails, un par utilisateur impacté"
        variables: [user.name, date, closureReason, creditsRefunded]
        note: "Le test vérifie que brevo.sendEmail est appelé EXACTEMENT N fois (pas N+1)"

# ─── ENV REQUIS ───────────────────────────────────────────────────────────────
env_required:
  DATABASE_URL: "connection string Neon branche develop"
  NEXTAUTH_SECRET: "valeur des Slices précédentes"
  NEXTAUTH_URL: "http://localhost:3000"
  STRIPE_MOCK: "true"
  BREVO_MOCK: "true"

# ─── RÈGLES MÉTIER ────────────────────────────────────────────────────────────
business_rules:
  member_alert: "!isMember AND count(CONFIRMED reservations) > 3 → ligne rouge"
  proxy:
    - "isProxy=true sur la réservation"
    - "Débite les crédits de l'utilisateur CIBLE, pas de l'admin"
    - "Respecte le seuil -3 pour l'utilisateur cible"
    - "Email envoyé à l'utilisateur CIBLE"
  organisation: "type=ORGANIZATION, userId=null, costCredits=null, impacte la capacité"
  date_closure_batch: |
    $transaction atomique :
    1. Créer ClosedDate
    2. Annuler toutes CONFIRMED DESK sur cette date (PAS les déjà CANCELLED)
    3. Pour chaque réservation annulée : credits++ + Transaction(CANCELLATION_REFUND)
    4. brevo.sendEmail('annulation-par-admin') à chaque user impacté
    5. Créer réservation ORGANIZATION pour bloquer la journée

# ─── TESTS ────────────────────────────────────────────────────────────────────
tests:

  unit:
    file: "__tests__/admin.test.ts"
    cases:
      - "Alerte rouge si !isMember ET reservationCount > 3"
      - "Pas d'alerte si isMember=true même avec > 3 résas"
      - "Pas d'alerte si reservationCount = 3 (seuil strictement > 3)"
      - "Proxy débite utilisateur CIBLE, pas admin"
      - "Proxy respecte seuil -3 pour l'utilisateur cible"
      - "Proxy crée isProxy=true"
      - "Organisation type=ORGANIZATION, costCredits=null"
      - "Organisation réduit capacité de 1 sans débiter personne"
      - "Batch annule UNIQUEMENT les CONFIRMED (pas les CANCELLED)"
      - "Batch ne crée pas de double remboursement"
      - "Batch rembourse le bon montant à chaque user"
      - "Batch crée une Transaction CANCELLATION_REFUND par user impacté"
      - "Ajustement crédit crée Transaction ADMIN_ADJUSTMENT avec description"

  http:
    file: "__tests__/api/slice-05-admin.http.test.ts"
    tool: next-test-api-route-handler
    mocks_required:
      - "vi.mock('@/lib/brevo')  ← CRITIQUE pour vérifier le nombre exact d'emails"
    cases:
      - route: "GET /api/admin/members"
        scenario: "Admin voit les membres"
        auth: admin@placev.fr
        expected_status: 200

      - route: "GET /api/admin/members"
        scenario: "Non-admin → 403"
        auth: externe@test.fr
        expected_status: 403

      - route: "PUT /api/admin/members/[id]/credits"
        scenario: "Ajustement valide avec description"
        auth: admin@placev.fr
        body: { delta: 5, description: "Correction manuelle" }
        expected_status: 200
        assert_brevo: "brevo.sendEmail NON appelé (ajustement silencieux)"

      - route: "PUT /api/admin/members/[id]/credits"
        scenario: "Description manquante → 422"
        expected_status: 422

      - route: "POST /api/admin/bookings/proxy"
        scenario: "Proxy valide"
        auth: admin@placev.fr
        body: { targetUserId: "id-externe", date: FUTURE_DATE, slot: "AM" }
        expected_status: 201
        side_effects: ["targetUser.credits -= 1 (pas admin.credits)", "isProxy=true"]
        assert_brevo: "brevo.sendEmail TO targetUser.email avec template='confirmation-reservation'"

      - route: "POST /api/admin/bookings/proxy"
        scenario: "Solde cible insuffisant"
        expected_status: 403
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/admin/bookings/organisation"
        scenario: "Blocage organisation"
        auth: admin@placev.fr
        expected_status: 201
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/admin/close-date"
        scenario: "Fermeture avec 2 CONFIRMED + 1 déjà CANCELLED"
        auth: admin@placev.fr
        body: { date: FUTURE_DATE, reason: "Fermeture test" }
        expected_status: 200
        assert_brevo: "brevo.sendEmail appelé EXACTEMENT 2 fois (pas 3)"
        assert_brevo_template: "annulation-par-admin pour chacun"

      - route: "GET /api/admin/export/reservations"
        expected_status: 200
        expected_headers: { Content-Type: "text/csv" }

  e2e:
    file: "e2e/slice-05-admin.spec.ts"
    tool: playwright
    cases:
      - "Admin voit le tableau des membres"
      - "Membres non-adhérents avec > 3 résas en rouge"
      - "Admin modifie le solde d'un membre (modale + description obligatoire)"
      - "Admin change le statut adhérent"
      - "Admin crée une réservation proxy → console '[Brevo Mock] confirmation-reservation TO cible'"
      - "Admin ferme une date → console affiche N fois '[Brevo Mock] annulation-par-admin'"
      - "Admin modifie la capacité open-space"
      - "Export CSV déclenche un téléchargement"

done_when:
  - npm run test → vert (unitaires + HTTP)
  - npm run test:e2e:slice5 → vert
  - Fermeture de date atomique sur Neon develop (rollback si erreur)
  - Console montre exactement N emails mockés lors d'une fermeture de date
