feature: workspace-reservation
slice: 3
title: "Réservation de Postes & Calendrier"
user_stories: [US-3.1, US-3.2, US-3.4, US-3.5]
estimated_days: 4
status: ready

dependencies: [slice-01, slice-02]

# ─── BASE DE DONNÉES ──────────────────────────────────────────────────────────
database:
  provider: Neon (Serverless Postgres)
  local_branch: develop
  new_models: [Reservation, ClosedDate]

# ─── MOCKS ACTIFS ─────────────────────────────────────────────────────────────
mocks:
  stripe: "non requis pour cette Slice (pas de paiement)"
  brevo:
    variable: "BREVO_MOCK=true"
    behavior: "Logge les emails en console + stocke dans mockEmailLog[] — aucun envoi réel"
    emails_triggered:
      - template: "confirmation-reservation"
        trigger: "Réservation CONFIRMED créée"
        variables: [user.name, date, slot, costCredits, newBalance, cancellation_link]
      - template: "confirmation-annulation"
        trigger: "Annulation par l'utilisateur"
        variables: [user.name, date, slot, creditsRefunded, newBalance]

# ─── ENV REQUIS ───────────────────────────────────────────────────────────────
env_required:
  DATABASE_URL: "connection string Neon branche develop"
  NEXTAUTH_SECRET: "valeur des Slices précédentes"
  NEXTAUTH_URL: "http://localhost:3000"
  BREVO_MOCK: "true"
  STRIPE_MOCK: "true"  # déjà en place depuis Slice 2

# ─── RÈGLES MÉTIER ────────────────────────────────────────────────────────────
out_of_scope:
  - "Règle gratuité salle < 2h pour coworkers — gestion physique, NE PAS IMPLÉMENTER"

business_rules:
  slots: "AM = 1 crédit (09h-13h), PM = 1 crédit (14h-18h), FULL = 2 crédits (09h-18h)"
  capacity_source: "SystemSetting key DESK_CAPACITY — jamais hardcodé"
  balance_threshold: "user.credits - cost >= -3 (sinon 403)"
  examples:
    - "credits=-2 + cost=1 → -3 → AUTORISÉ (limite exacte)"
    - "credits=-2 + cost=2 → -4 → REFUSÉ"
    - "credits=-3 + cost=1 → -4 → REFUSÉ"
  cancellation: "now() < reservation.start - 12h (sinon 422)"
  concurrency: "Prisma $transaction atomique sur COUNT + INSERT"
  closed_dates: "ClosedDate → remaining=0, réservation → 422"

api_routes:
  - GET /api/availability → créneaux disponibles (public)
  - POST /api/booking → créer réservation (auth required)
  - POST /api/booking/[id]/cancel → annuler réservation (auth required)

# ─── FRONTEND — COMPOSANT CALENDRIER ─────────────────────────────────────────
frontend:
  component: BookingCalendar
  file: "components/booking/BookingCalendar.tsx"
  type: "'use client' — React Client Component"
  page: "app/(app)/booking/page.tsx"
  page_access: "public — visible sans connexion, réservation nécessite auth"

  starting_point: |
    Un composant de base est fourni dans /components/booking/BookingCalendarBase.tsx.
    L'agent DOIT partir de ce composant et l'adapter — ne pas réécrire from scratch.
    Les helpers de date (getMonthGrid, startOfWeekMonday, formatYMD, addDays) sont
    déjà corrects A priori, l'agent doit réexploiter et adapter. 

  base_component_what_to_keep:
    - "Tous les helpers de date (getMonthGrid, startOfWeekMonday, formatYMD, addDays)"
    - "La structure useEffect + fetch vers GET /api/availability"
    - "Le availMap (Map<date|slot, remaining>) pour lookup O(1)"
    - "La grille 6 semaines × 7 jours (42 cases)"
    - "La navigation mois par mois (monthCursor, setMonthCursor)"
    - "La détection des jours hors-mois courant"
    - "Les animations Framer Motion existantes"

  base_component_what_to_change:
    - "Supprimer HALF_DAY_PRICE_EUR, FULL_DAY_PRICE_EUR — les prix sont en crédits, pas en euros"
    - "Supprimer DAILY_CAPACITY — vient de l'API (remaining dans availability)"
    - "Supprimer la logique quantity (nb de personnes) — une réservation = 1 personne"
    - "Supprimer le fallback démo — remplacer par un vrai état d'erreur UI"
    - "Remplacer selections (Record<string, SelectionItem>) par selectedSlot (objet unique)"
    - "Brancher la confirmation sur POST /api/booking"

  slot_states:
    available:
      condition: "remaining > 0 ET date >= aujourd'hui ET pas ClosedDate"
      display: "Places restantes (ex: '8 places')"
      style: "fond clair, curseur pointer, hover effect"
      data_attrs: "data-testid='slot-tile', data-date='YYYY-MM-DD', data-slot='AM|PM|FULL', data-remaining={n}"

    full:
      condition: "remaining = 0 ET date future"
      display: "'Complet'"
      style: "fond grisé, curseur not-allowed"
      data_attrs: "data-testid='slot-tile', data-full='true'"

    past:
      condition: "date < aujourd'hui"
      display: "Grisé, non cliquable"
      data_attrs: "data-testid='slot-tile', data-disabled='true'"

    closed:
      condition: "remaining = 0 depuis une ClosedDate"
      display: "'Fermé' — couleur distincte de 'Complet'"
      note: "L'API retourne remaining=0 pour les deux cas. Ajouter un champ isClosed
             dans la réponse GET /api/availability pour distinguer les deux."
      data_attrs: "data-testid='slot-tile', data-disabled='true', data-closed='true'"

    out_of_month:
      condition: "jour hors du mois affiché"
      display: "Opacité réduite, non cliquable"

  selection_flow:
    step_1_select: |
      Clic sur tuile disponible → sélection mémorisée dans selectedSlot
      Ouvrir un panneau de confirmation sous le calendrier (pas de modale bloquante)
      data-testid="booking-summary" sur ce panneau

    step_2_summary: |
      Le panneau affiche :
        - Date lisible ("Lundi 15 mars 2025")
        - Créneau ("Matin 08h30–13h" / "Après-midi 13h–18h" / "Journée 08h30–18h")
        - Coût : "1 crédit" ou "2 crédits"
        - Solde après réservation (si authentifié) : "Votre solde : 4 → 3 crédits"
        - Si non authentifié : "Connectez-vous pour réserver" + lien /login

    step_3_confirm: |
      Bouton "Confirmer la réservation" (data-testid="confirm-booking")
      → spinner pendant POST /api/booking { date, slot }

    step_4_result:
      success: |
        data-testid="booking-success" visible
        Solde affiché mis à jour immédiatement
        Tuile passe à remaining-1 (rechargement availability du mois)
        Panneau se ferme après 2s ou sur clic "Fermer"

      error_balance: |
        data-testid="error-insufficient-balance" visible
        data-testid="link-buy-credits" → lien vers /dashboard/recharger

      error_full: |
        data-testid="error-slot-full" visible
        Rechargement automatique de l'availability

      error_closed: |
        Message "Ce jour est fermé" — pas de data-testid spécifique requis

  data_testids:
    - "booking-calendar"           # conteneur principal
    - "calendar-prev-month"        # bouton ←
    - "calendar-next-month"        # bouton →
    - "calendar-month-label"       # texte "Mars 2025"
    - "slot-tile"                  # chaque tuile AM/PM/FULL
    - "booking-summary"            # panneau de confirmation
    - "confirm-booking"            # bouton confirmer
    - "booking-success"            # message succès
    - "error-insufficient-balance" # message solde insuffisant
    - "link-buy-credits"           # lien vers /dashboard/recharger
    - "error-slot-full"            # message créneau pris

  dashboard_integration:
    file: "app/(app)/dashboard/page.tsx"
    section: "upcoming-reservations"
    display: |
      Liste des réservations CONFIRMED à venir, triées par date ASC.
      Pour chaque réservation : date lisible, créneau, coût en crédits.
      Bouton "Annuler" si now() < reservation.start - 12h.
    data_testids:
      - "upcoming-reservations"    # conteneur liste
      - "cancel-booking-btn"       # bouton annuler par réservation
      - "confirm-cancel"           # bouton de confirmation dans dialog
      - "cancel-success"           # message succès annulation

# ─── TESTS ────────────────────────────────────────────────────────────────────
tests:

  unit:
    file: "__tests__/booking.test.ts"
    cases:
      # Logique métier crédits
      - "AM = 1 crédit, PM = 1 crédit, FULL = 2 crédits"
      - "credits=-2 + cost=1 → -3 → AUTORISÉ"
      - "credits=-2 + cost=2 → -4 → REFUSÉ"
      - "credits=-3 + cost=1 → -4 → REFUSÉ"
      - "Annulation > 12h → autorisée"
      - "Annulation < 12h → refusée"
      - "Double annulation (status=CANCELLED) → refusée — pas de double remboursement"
      - "ClosedDate → remaining = 0 sur tous les créneaux"
      - "DESK_CAPACITY dynamique respectée"
      # Helpers calendrier (fonctions pures extraites du composant de base)
      - "getMonthGrid retourne exactement 42 jours"
      - "getMonthGrid commence toujours un lundi"
      - "startOfWeekMonday(mercredi) → lundi de la même semaine"
      - "startOfWeekMonday(lundi) → ce même lundi inchangé"
      - "startOfWeekMonday(dimanche) → lundi de la semaine précédente"
      - "formatYMD retourne YYYY-MM-DD sans décalage timezone"
      - "Tuile avec date < aujourd'hui → disabled=true"
      - "Tuile avec remaining=0 → full=true"

  http:
    file: "__tests__/api/slice-03-booking.http.test.ts"
    tool: next-test-api-route-handler
    mocks_required:
      - "vi.mock('@/lib/brevo')  ← OBLIGATOIRE — asserter les emails de confirmation"
    cases:
      - route: "GET /api/availability"
        scenario: "Plage valide"
        expected_status: 200
        expected_schema: "Array<{ date, slot: AM|PM, remaining: number }>"

      - route: "GET /api/availability"
        scenario: "ClosedDate → all remaining=0"
        expected_status: 200

      - route: "GET /api/availability"
        scenario: "Paramètres manquants"
        expected_status: 400

      - route: "POST /api/booking"
        scenario: "Réservation AM valide (credits=5)"
        auth: externe@test.fr
        body: { date: FUTURE_DATE, slot: "AM" }
        expected_status: 201
        expected_body: { status: "CONFIRMED", costCredits: 1 }
        side_effects: ["user.credits -= 1", "Transaction BOOKING_DEBIT créée"]
        assert_brevo: "brevo.sendEmail appelé avec template='confirmation-reservation'"
        assert_brevo_variables: "{ slot: 'AM', costCredits: 1 }"

      - route: "POST /api/booking"
        scenario: "Non authentifié"
        expected_status: 401
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/booking"
        scenario: "Solde insuffisant (credits=-2, FULL)"
        auth: pauvre@test.fr
        expected_status: 403
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/booking"
        scenario: "Créneau complet"
        expected_status: 409
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/booking"
        scenario: "Date fermée"
        expected_status: 422
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/booking/[id]/cancel"
        scenario: "Annulation valide > 12h"
        expected_status: 200
        side_effects: ["status=CANCELLED", "user.credits remboursés", "Transaction CANCELLATION_REFUND"]
        assert_brevo: "brevo.sendEmail appelé avec template='confirmation-annulation'"
        assert_brevo_variables: "{ creditsRefunded: 1 }"

      - route: "POST /api/booking/[id]/cancel"
        scenario: "Réservation d'un autre utilisateur"
        expected_status: 403
        assert_brevo: "brevo.sendEmail NON appelé"

      - route: "POST /api/booking/[id]/cancel"
        scenario: "Double annulation"
        expected_status: 422
        assert_brevo: "brevo.sendEmail NON appelé"

  e2e:
    file: "e2e/slice-03-booking.spec.ts"
    tool: playwright
    cases:
      # Calendrier — navigation et affichage
      - "Calendrier visible sur /booking sans connexion"
      - "Navigation ← → change le mois affiché (calendar-month-label mis à jour)"
      - "Dates passées affichées en grisé — data-disabled=true, non cliquables"
      - "Tuile remaining=0 affiche 'Complet' — data-full=true"
      # Sélection et confirmation
      - "Clic sur tuile disponible → booking-summary s'ouvre avec date et créneau"
      - "Panneau affiche le coût en crédits (1 ou 2)"
      - "Sans connexion → message 'Connectez-vous' + lien /login dans le panneau"
      - "Connecté → confirm-booking visible, solde après réservation affiché"
      # Réservation
      - "Réservation AM → booking-success visible → solde -1 dans le header"
      - "Réservation FULL → booking-success visible → solde -2 dans le header"
      - "Après réservation → tuile passe à remaining-1 (rechargement availability)"
      - "Réservation visible dans upcoming-reservations sur /dashboard"
      # Erreurs
      - "Solde insuffisant → error-insufficient-balance + link-buy-credits visible"
      # Annulation
      - "Bouton cancel-booking-btn visible si annulation possible (> 12h)"
      - "Clic cancel-booking-btn → confirm-cancel → cancel-success → crédits remboursés"
      # Brevo mock
      - "Console affiche '[Brevo Mock] confirmation-reservation' après réservation"
      - "Console affiche '[Brevo Mock] confirmation-annulation' après annulation"

done_when:
  - npm run test → vert (unitaires + HTTP — 18 cas)
  - npm run test:e2e:slice3 → vert (17 scénarios Playwright)
  - Calendrier navigable sur http://localhost:3000/booking
  - Réservation bout en bout : sélection → panneau → confirmation → solde mis à jour
  - Annulation depuis /dashboard → crédits remboursés
  - Console affiche les emails Brevo mockés à chaque action