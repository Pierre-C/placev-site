  admin-calendar:           "Conteneur principal (inchangé)"
  admin-calendar-grid:      "Wrapper de la grille (inchangé)"
  admin-slot-am:            "Cellule AM (remplace admin-calendar-slot-tile avec data-slot=AM)"
  admin-slot-pm:            "Cellule PM (remplace admin-calendar-slot-tile avec data-slot=PM)"
  # data-attributes sur chaque cellule :
  #   data-date="YYYY-MM-DD"
  #   data-count="5"
  #   data-capacity="15"
  #   data-disabled="true|false"
  #   data-selected="true|false"

  # Panneau
  admin-slots-panel:        "Panneau de gestion (remplace admin-calendar-date-panel)"
  admin-selected-slot-chip: "Chip d'un créneau sélectionné (data-date, data-slot)"
  admin-cancel-slot-btn:    "Bouton 'Annuler tout' pour un créneau (inchangé)"
  admin-close-date-btn:     "Bouton 'Fermer cette date' (inchangé)"
  admin-open-date-btn:      "Bouton 'Réouvrir cette date' (inchangé)"
  admin-reservations-table: "Tableau fusionné des réservations (inchangé)"
  admin-reservation-row:    "Ligne du tableau (inchangé)"
  admin-cancel-btn:         "Bouton annuler individuel (inchangé)"
  admin-confirm-dialog:     "Dialog de confirmation (inchangé)"
  admin-confirm-yes:        "Confirmer (inchangé)"
  admin-confirm-no:         "Annuler (inchangé)"
  admin-action-success:     "Toast de succès (inchangé)"

  deprecated:
    - admin-calendar-slot-tile  # remplacé par admin-slot-am / admin-slot-pm
    - admin-calendar-date-panel # remplacé par admin-slots-panel

breaking_changes:
  - data-testid "admin-calendar-slot-tile" supprimé → remplacé par admin-slot-am / admin-slot-pm
  - data-testid "admin-calendar-date-panel" supprimé → remplacé par admin-slots-panel
  - State interne : selectedDate (string|null) → selectedSlots (SelectedAdminSlot[])
  - Le panneau affiche désormais une colonne "Créneau" (date+slot) dans le tableau

tests_to_update:
  - "__tests__/api/slice-05-admin.http.test.ts"
    # Aucun test HTTP à modifier (les routes API sont inchangées)

tests_to_create:
  - "e2e/slice-09b-admin-calendar.spec.ts"
    scenarios:
      - "la grille affiche des cellules AM et PM rectangulaires pour chaque jour ouvert"
      - "cliquer sur un créneau AM l'ajoute à la sélection"
      - "re-cliquer sur un créneau sélectionné le retire"
      - "sélectionner plusieurs créneaux affiche toutes leurs réservations dans le panneau"
      - "le panneau est renommé 'créneaux sélectionnés' (plus 'journée')"
      - "le tableau fusionné affiche la colonne 'Créneau' avec date+slot"
      - "annuler tout AM sur un créneau sélectionné vide ce créneau"
      - "fermer une date depuis le panneau ferme la journée complète"

notes: |
  - Le composant BookingCalendar.tsx (membre) N'EST PAS modifié dans ce slice.
  - Seul AdminCalendar.tsx est refactoré.
  - La navigation mois (prev/next) reste identique à l'existant.
  - Le composant admin n'a pas de fonctionnalité "panier/confirm" — les actions
    sont directes (pas de bouton "Confirmer la sélection").
  - Les créneaux passés restent grisés et non-cliquables (cohérence membre).
  - Les créneaux fermés (ClosedDate) sont grisés et non-cliquables, même pour l'admin
    (l'admin doit d'abord réouvrir la date via le bouton dédié si elle est dans la sélection).
