version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: placev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: placev_dev
    ports:
      - "5432:5432"
    volumes:
      - placev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  placev_postgres_data:
